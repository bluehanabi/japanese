name: Deploy to Mac server (수동 전용)

# 수동(workflow_dispatch)으로만 실행. 자동 배포는 맥의 launchd(install-autodeploy.sh)가 담당
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 1) 맥북으로 앱 파일 전송 (맥북은 GitHub 인증이 필요 없음)
      - name: 맥북으로 파일 전송 (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASS }}
          source: "kanji-flow-v2/**"
          target: "~/japanese"
          overwrite: true

      # 2) 맥북에서 서버 재시작
      - name: 맥북에서 서버 재시작 (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASS }}
          script: |
            cd ~/japanese/kanji-flow-v2
            # launchd가 서버를 관리하면 재시작만(새 코드 반영), 미설치면 옛 방식으로 직접 실행
            launchctl kickstart -k "gui/$(id -u)/com.kanjiflow.server" 2>/dev/null || bash serve.sh --bg
            echo "배포 완료: http://192.168.10.35:8005"
